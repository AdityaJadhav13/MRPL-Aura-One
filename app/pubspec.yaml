name: h2s_doseband
description: >-
  H2S DoseBand - phone reader for a passive colorimetric cumulative hydrogen
  sulfide exposure badge. SIH 2026 / PS 26118.
publish_to: none
resolution: workspace

# versionName+versionCode. Bump versionCode on every upload to Play.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # The scientific core. Pure Dart, no Flutter. See ADR-0004.
  measurement:
    path: ../packages/measurement

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
