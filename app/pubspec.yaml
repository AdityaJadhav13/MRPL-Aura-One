name: h2s_doseband
description: >-
  H2S DoseBand - phone reader for a passive colorimetric cumulative hydrogen
  sulfide exposure badge. SIH 2026 / PS 26118.
publish_to: none
resolution: workspace

# versionName+versionCode. Bump versionCode on every upload to Play.
version: 0.5.3+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # The scientific core. Pure Dart, no Flutter. See ADR-0004.
  measurement:
    path: ../measurement-engine

  # Role-based shells with redirect guards (worker / officer / admin) are
  # awkward and error-prone with imperative Navigator. That is the whole
  # justification; deep links are not a requirement. See ADR-0001.
  go_router: ^18.0.1
  flutter_riverpod: ^3.0.0

  # First-party. Gives the frame stream the guidance overlay needs, and the
  # capability/metadata surface that directive s6 and s7 require. The camera is
  # part of the instrument, so what it can and cannot do is measurement
  # metadata, not a UI detail.
  camera: ^0.12.1

  # Verifies the packaged geometry against its manifest before it is parsed.
  crypto: ^3.0.0

  # Somewhere to write dossier V0 captures. Without durable storage the
  # physical session produces nothing that survives closing the app.
  path_provider: ^2.1.0
  device_info_plus: ^13.2.0
  share_plus: ^13.3.0
  zxing2: ^0.2.4
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.10.1

flutter:
  # Plain `flutter run` installs the dev flavour, matching lib/main.dart.
  # Without this Gradle builds all three flavours and the tool cannot tell
  # which APK to install.
  default-flavor: dev
  uses-material-design: true

  assets:
    # GENERATED. Do not edit by hand and do not add a second copy of a
    # geometry here. The canonical source is measurement-engine/geometry/;
    # `dart run tool/export_geometry.dart` regenerates this directory and CI
    # fails if it has drifted.
    - assets/geometry/

    # Corporate brand assets, supplied by the project owner. Bundled, never
    # fetched: the authentication flow must work with no connectivity.
    - assets/images/

  # Fonts are bundled, not fetched. The app must complete a reading offline, so
  # a runtime font download (google_fonts) is not acceptable here. IBM Plex is
  # OFL licensed; see assets/fonts/OFL.txt.
  fonts:
    - family: IBMPlexSans
      fonts:
        # Variable font: weight comes from the wght axis, set in typography.dart.
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
