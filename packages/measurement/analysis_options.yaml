include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # This package is the scientific core. Silent failure is the enemy.
    missing_return: error
    dead_code: error
    unused_import: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - require_trailing_commas
